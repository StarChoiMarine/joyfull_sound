<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기니또 - 기쁜소리 기도 파트너</title>
  <style>
    :root { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f7f9fc; color: #1f2a44; }
    .container { max-width: 1080px; margin: 0 auto; padding: 24px; }
    h1, h2, h3 { margin: 0 0 12px; }
    .card { background: white; border-radius: 14px; padding: 18px; box-shadow: 0 3px 12px rgba(31,42,68,.08); margin-bottom: 16px; }
    .grid { display: grid; gap: 16px; }
    .two { grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); }
    label { display:block; font-size: 14px; margin-bottom: 6px; font-weight:600; }
    input, textarea, select, button { font: inherit; }
    input, textarea, select { width: 100%; box-sizing: border-box; border:1px solid #d6dbe5; border-radius: 10px; padding: 10px; }
    textarea { min-height: 94px; resize: vertical; }
    button { border:none; border-radius: 10px; padding: 10px 14px; background:#3557ff; color:white; cursor:pointer; font-weight:700; }
    button.secondary { background:#e9eeff; color:#3557ff; }
    button.danger { background:#e43f5a; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    .muted { color:#5f6c89; font-size: 14px; }
    .chip { display:inline-block; background:#eef2ff; color:#2740c3; border-radius:999px; padding:5px 10px; margin-right:6px; margin-bottom:6px; font-size:13px; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #eef1f6; }
    .letter { border:1px solid #dbe3ff; border-radius:10px; padding:12px; margin-bottom:10px; }
    .letter .meta { font-size:12px; color:#5f6c89; margin-bottom:6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 기니또 매칭 페이지</h1>
    <p class="muted">기니또를 자동 배정하고, 기도 제목을 나누고, 익명 편지를 주고받을 수 있어요.</p>

    <section class="card">
      <h2>1) 참여자 등록</h2>
      <div class="grid two">
        <div>
          <label for="memberName">이름</label>
          <input id="memberName" placeholder="예: 김기쁜" />
        </div>
        <div>
          <label for="prayerTopic">기도 제목</label>
          <textarea id="prayerTopic" placeholder="서로를 위해 기도할 내용을 적어주세요"></textarea>
        </div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button id="addMember">참여자 추가</button>
        <button id="resetAll" class="danger">전체 초기화</button>
      </div>
      <div id="memberChips" style="margin-top:12px;"></div>
    </section>

    <section class="card">
      <h2>2) 기니또 배정</h2>
      <p class="muted">중복 없이 원형으로 랜덤 배정됩니다. (본인을 본인에게 배정하지 않음)</p>
      <div class="row">
        <button id="assignBtn">배정하기</button>
      </div>
      <div id="assignments" style="margin-top:12px;"></div>
    </section>

    <section class="card grid two">
      <div>
        <h2>3) 내가 기도하는 사람 확인</h2>
        <label for="viewer">내 이름 선택</label>
        <select id="viewer"></select>
        <div id="myTarget" style="margin-top:10px;"></div>
      </div>
      <div>
        <h2>4) 나를 위해 기도하는 사람에게 편지</h2>
        <p class="muted">이 편지는 <strong>실명 발신</strong>으로 전달돼요.</p>
        <label for="toMyGiver">내 이름 선택</label>
        <select id="toMyGiver"></select>
        <label for="letterToGiver" style="margin-top:8px;">내용</label>
        <textarea id="letterToGiver" placeholder="기도해줘서 고마워요 🙏"></textarea>
        <button id="sendToGiver" style="margin-top:8px;">보내기</button>
      </div>
    </section>

    <section class="card">
      <h2>5) 내가 기도하는 사람에게 익명 편지</h2>
      <p class="muted">이 편지는 <strong>발신자 미표시</strong>로 전달돼요.</p>
      <label for="anonSender">내 이름 선택</label>
      <select id="anonSender"></select>
      <label for="anonLetter" style="margin-top:8px;">내용</label>
      <textarea id="anonLetter" placeholder="오늘도 하나님 안에서 힘내요!"></textarea>
      <button id="sendAnon" style="margin-top:8px;">익명 편지 보내기</button>
    </section>

    <section class="card">
      <h2>6) 받은 편지함</h2>
      <label for="inboxMember">이름 선택</label>
      <select id="inboxMember"></select>
      <div id="inbox" style="margin-top:10px;"></div>
    </section>
  </div>

  <script>
    const state = JSON.parse(localStorage.getItem("ginito-state") || "null") || {
      members: [],
      assignments: {},
      letters: []
    };

    const el = (id) => document.getElementById(id);

    function persist() {
      localStorage.setItem("ginito-state", JSON.stringify(state));
    }

    function renderMembers() {
      const chips = el("memberChips");
      chips.innerHTML = state.members.length
        ? state.members.map((m) => `<span class="chip">${m.name}</span>`).join("")
        : "<span class='muted'>아직 참여자가 없습니다.</span>";

      ["viewer", "toMyGiver", "anonSender", "inboxMember"].forEach((id) => {
        const select = el(id);
        const current = select.value;
        select.innerHTML = state.members.length
          ? state.members.map((m) => `<option value="${m.name}">${m.name}</option>`).join("")
          : "<option value=''>참여자 없음</option>";
        if (state.members.some((m) => m.name === current)) select.value = current;
      });
      renderAssignments();
      renderMyTarget();
      renderInbox();
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function assignGinito() {
      if (state.members.length < 2) return alert("최소 2명 이상 필요해요.");
      const names = state.members.map((m) => m.name);
      const shuffled = shuffle(names);
      const rotated = [...shuffled.slice(1), shuffled[0]];
      state.assignments = {};
      shuffled.forEach((name, i) => { state.assignments[name] = rotated[i]; });
      persist();
      renderAssignments();
      renderMyTarget();
      alert("기니또 배정 완료!");
    }

    function renderAssignments() {
      const wrap = el("assignments");
      const entries = Object.entries(state.assignments);
      if (!entries.length) {
        wrap.innerHTML = "<span class='muted'>아직 배정되지 않았습니다.</span>";
        return;
      }
      wrap.innerHTML = `<table><thead><tr><th>기도하는 사람</th><th>기도받는 사람</th><th>기도 제목</th></tr></thead><tbody>${entries.map(([from,to]) => {
        const topic = state.members.find((m) => m.name === to)?.topic || "-";
        return `<tr><td>${from}</td><td>${to}</td><td>${topic}</td></tr>`;
      }).join("")}</tbody></table>`;
    }

    function renderMyTarget() {
      const me = el("viewer").value;
      const target = state.assignments[me];
      if (!me || !target) {
        el("myTarget").innerHTML = "<span class='muted'>이름을 선택하고 배정해 주세요.</span>";
        return;
      }
      const topic = state.members.find((m) => m.name === target)?.topic || "없음";
      el("myTarget").innerHTML = `<strong>${me}</strong> 님이 기도할 사람은 <strong>${target}</strong> 님입니다.<br/><span class='muted'>기도제목: ${topic}</span>`;
    }

    function sendLetter({anonymous}) {
      const sender = anonymous ? el("anonSender").value : el("toMyGiver").value;
      if (!sender) return alert("보내는 사람을 선택해 주세요.");
      if (!Object.keys(state.assignments).length) return alert("먼저 배정을 진행해 주세요.");

      let receiver = "";
      let message = "";
      if (anonymous) {
        receiver = state.assignments[sender];
        message = el("anonLetter").value.trim();
      } else {
        receiver = Object.keys(state.assignments).find((name) => state.assignments[name] === sender);
        message = el("letterToGiver").value.trim();
      }

      if (!receiver) return alert("수신자를 찾지 못했어요.");
      if (!message) return alert("편지 내용을 입력해 주세요.");

      state.letters.unshift({
        sender: anonymous ? "익명" : sender,
        receiver,
        message,
        createdAt: new Date().toLocaleString("ko-KR"),
        anonymous
      });

      if (anonymous) el("anonLetter").value = "";
      else el("letterToGiver").value = "";

      persist();
      renderInbox();
      alert("편지 전송 완료!");
    }

    function renderInbox() {
      const who = el("inboxMember").value;
      const letters = state.letters.filter((l) => l.receiver === who);
      el("inbox").innerHTML = letters.length
        ? letters.map((l) => `<div class="letter"><div class="meta">보낸이: ${l.sender} · ${l.createdAt}</div><div>${l.message}</div></div>`).join("")
        : "<span class='muted'>받은 편지가 없습니다.</span>";
    }

    el("addMember").addEventListener("click", () => {
      const name = el("memberName").value.trim();
      const topic = el("prayerTopic").value.trim();
      if (!name) return alert("이름을 입력해 주세요.");
      if (state.members.some((m) => m.name === name)) return alert("이미 있는 이름이에요.");
      state.members.push({ name, topic: topic || "기도제목 미입력" });
      el("memberName").value = "";
      el("prayerTopic").value = "";
      persist();
      renderMembers();
    });

    el("resetAll").addEventListener("click", () => {
      if (!confirm("정말 전체 데이터를 초기화할까요?")) return;
      state.members = [];
      state.assignments = {};
      state.letters = [];
      persist();
      renderMembers();
    });

    el("assignBtn").addEventListener("click", assignGinito);
    el("viewer").addEventListener("change", renderMyTarget);
    el("inboxMember").addEventListener("change", renderInbox);
    el("sendAnon").addEventListener("click", () => sendLetter({ anonymous: true }));
    el("sendToGiver").addEventListener("click", () => sendLetter({ anonymous: false }));

    renderMembers();
  </script>
</body>
</html>
